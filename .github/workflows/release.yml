name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache: true
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.24.0
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Build, checksum, inventory, sign, and publish
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest release archives
        uses: actions/attest@v4.2.0
        with:
          subject-checksums: ./dist/checksums.txt
